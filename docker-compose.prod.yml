# Portfolio → https://kaitr.dev   (www.kaitr.dev redirects to the apex)
# Deployed by .github/workflows/deploy.yml on the home server; see homelab-infra README.
name: portfolio

services:
  web:
    build: .
    restart: unless-stopped
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio.rule=Host(`kaitr.dev`) || Host(`www.kaitr.dev`)
      - traefik.http.routers.portfolio.entrypoints=web
      - traefik.http.routers.portfolio.middlewares=portfolio-www
      - traefik.http.middlewares.portfolio-www.redirectregex.regex=^https?://www\.kaitr\.dev/(.*)
      - traefik.http.middlewares.portfolio-www.redirectregex.replacement=https://kaitr.dev/$${1}
      - traefik.http.middlewares.portfolio-www.redirectregex.permanent=true
      - traefik.http.services.portfolio.loadbalancer.server.port=80

  # Contact form backend → https://kaitr.dev/api/*  (SMTP secrets from .env, never in the JS bundle)
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio-api.rule=Host(`kaitr.dev`) && PathPrefix(`/api`)
      # Explicit priority: Traefik defaults to rule length, and the web router's rule is longer,
      # so without this the SPA would swallow /api.
      - traefik.http.routers.portfolio-api.priority=100
      - traefik.http.routers.portfolio-api.entrypoints=web
      - traefik.http.services.portfolio-api.loadbalancer.server.port=8080

networks:
  edge:
    external: true
