name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT: portfolio
  COMPOSE_FILE: docker-compose.prod.yml

jobs:
  deploy:
    # Only repos owned by THKhai deploy (works for forks you own; blocks forks of yours)
    if: github.repository_owner == 'THKhai'
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Load server-side secrets
        run: |
          SRC="$HOME/apps/$PROJECT/.env"
          [ -f "$SRC" ] || { echo "::error::$SRC not found on server"; exit 1; }
          cp "$SRC" .env

      - name: Check edge network
        run: docker network inspect edge >/dev/null || { echo "::error::deploy infra first"; exit 1; }

      - name: Build and start
        run: docker compose -p "$PROJECT" up -d --build --remove-orphans

      - name: Wait until healthy
        run: |
          for i in $(seq 1 30); do
            states=$(docker compose -p "$PROJECT" ps --format '{{.Service}} {{.State}} {{.Health}}')
            echo "[$i] $states" | tr '\n' ';'; echo
            if [ -n "$states" ] && ! echo "$states" | grep -qvE ' running( healthy|\s*$)'; then
              echo "All services up"; exit 0
            fi
            sleep 5
          done
          docker compose -p "$PROJECT" logs --tail=80
          exit 1

      - name: Prune old images
        if: always()
        run: docker image prune -f >/dev/null
